name: Daily RFP Scan
on:
  schedule:
    - cron: '0 14 * * *'  # Runs at 8:00 AM CST
  workflow_dispatch:      # Enables the manual 'Play' button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Permits saving history back to seen_ids.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Run Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "RFP Bot"
          git config --global user.email "bot@github.com"
          git add seen_ids.txt
          git commit -m "Update history" || echo "No changes"
          git push origin main
